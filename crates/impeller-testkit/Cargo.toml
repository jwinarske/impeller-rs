[package]
name = "impeller-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
# Exists to test this workspace, and its API is shaped by that: the catalog, the
# corpus, the scene model and the comparison tolerances are all answers to "how do
# these crates check themselves". Publishing it would commit that shape to
# semantic versioning for the benefit of callers who have not asked for it. Flip
# this to `true` if that changes -- nothing else has to move.
publish = false
license.workspace = true
repository.workspace = true
description = "Shared test harness for impeller-rs: scene corpus and cross-backend comparison."
keywords = ["testing", "graphics", "harness", "golden"]
categories = ["development-tools::testing", "graphics"]

[lints]
workspace = true

[dependencies]
half.workspace = true
glam = { workspace = true }
impeller-core = { workspace = true }
impeller-geometry = { workspace = true }
impeller-text = { workspace = true }
impeller-hal = { workspace = true }
impeller-shaders = { workspace = true }
impeller-renderer = { workspace = true }

[dev-dependencies]
googletest = { workspace = true }
impeller-hal-vulkan = { path = "../impeller-hal-vulkan" }
impeller-hal-gles = { path = "../impeller-hal-gles" }
