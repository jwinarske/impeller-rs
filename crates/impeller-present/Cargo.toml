[package]
name = "impeller-present"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Presentation target trait and format negotiation for impeller-rs."
keywords = ["presentation", "swapchain", "graphics", "display"]
categories = ["graphics", "rendering"]

[lints]
workspace = true

[dependencies]
impeller-hal = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# Only the frame-loop test, which presents a recording. The library itself
# stays below the canvas: a presentation target hands out a texture and knows
# nothing about what is drawn into it.
impeller-core = { path = "../impeller-core" }
impeller-hal-vulkan = { path = "../impeller-hal-vulkan" }
impeller-testkit = { path = "../impeller-testkit" }
impeller-renderer = { path = "../impeller-renderer" }
