[package]
name = "impeller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `drm` is presentation-only and composes with either rendering backend:
#   --features vulkan,drm       Vulkan rendering with KMS scanout
#   --features gles,drm         the classic embedded GBM path
#   --features vulkan,gles,drm  one binary that picks at runtime
[features]
default = ["vulkan", "present-wsi"]
vulkan = ["dep:impeller-hal-vulkan"]
gles = ["dep:impeller-hal-gles"]
drm = ["dep:impeller-present-drm"]
present-wsi = []

[dev-dependencies]
# The image comparator, so that a canvas-level scene can be diffed across
# backends the same way the scene corpus is. Not a dependency of the library:
# nothing here ships in it.
impeller-testkit = { workspace = true }
# This crate, on itself, to turn on the backends its tests compare. The default
# feature set is one backend, which is right for a consumer on a board that has
# one -- but it would leave the cross-backend test with nothing to compare and
# passing anyway, which is the failure mode worth the most trouble to avoid.
# Enabling the feature here rather than asking for a flag means the comparison
# runs under a plain `cargo test`, which is the only kind that gets run.
impeller = { path = ".", features = ["gles"] }

[dependencies]
impeller-core = { workspace = true }
impeller-hal = { workspace = true }
impeller-present = { workspace = true }
impeller-hal-vulkan = { workspace = true, optional = true }
impeller-hal-gles = { workspace = true, optional = true }
impeller-present-drm = { workspace = true, optional = true }
