[package]
name = "impeller-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Impeller C API (libimpeller) for impeller-rs, ABI-compatible with the Flutter Engine's."
keywords = ["ffi", "capi", "impeller", "flutter", "bindings"]
categories = ["external-ffi-bindings", "graphics"]

[lib]
# Produces libimpeller.so / .dylib / impeller.dll, the artifact a C API
# consumer links against in place of the upstream build. The name is the whole
# point: a drop-in has to be findable under the name the linker expects.
#
# Deliberately no rlib. Nothing depends on this crate from Rust — it exists to
# emit the C artifact — and an rlib would collide with the facade crate's, which
# cargo currently warns about and intends to make an error.
name = "impeller"
crate-type = ["cdylib", "staticlib"]
# Not documented by `cargo doc` either, for the same collision: rustdoc writes a
# library's pages under its name, and the facade's are `target/doc/impeller`
# too, so `cargo doc --workspace` refuses to build at all while both ask. The
# facade's are the ones a Rust reader wants. This crate's contract is upstream's
# `impeller.h`, and its module documentation stays where its readers are, in
# the source.
doc = false

[lints]
workspace = true

[dependencies]
impeller-core = { workspace = true }
