[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Checked rather than asserted: the `msrv` job in `.github/workflows/ci.yml`
# builds the workspace on exactly this toolchain. It was 1.82 and untrue --
# naga is a build dependency of the shader crate and reaches indexmap, which
# moved to edition 2024 and with it to a 1.85 floor. Nothing noticed, because
# a version declared here only fails a build when a *direct* dependency asks
# for more than it.
rust-version = "1.85"
publish = false
# Matches the Flutter Engine, where the C++ Impeller this project takes its
# architecture from lives. Any code ported from there keeps its own copyright
# notice alongside ours.
license = "BSD-3-Clause"

# Dependency versions are pinned here and inherited by every member via
# `dep = { workspace = true }`, so a bump is a single reviewed edit.
#
# Hard constraint: every entry must compile from pure Rust source. No C/C++
# toolchain, cmake, or pkg-config at build time -- that property is what keeps
# cross-compilation to aarch64/riscv64 boards and containerized CI builds
# trivial, and it is enforced by the bans in deny.toml.
[workspace.dependencies]
# --- rendering ---
ash = "0.38"
gpu-allocator = "0.27"
glow = "0.14"
# NEVER enable the "static" feature: it requires libEGL plus pkg-config at link
# time, which breaks clean cross-builds. "dynamic" dlopens libEGL at runtime.
khronos-egl = { version = "6", features = ["dynamic"] }

# --- presentation ---
raw-window-handle = "0.6"
ash-window = "0.13"

# --- core ---
lyon_tessellation = "1"
swash = "0.1"
glam = "0.27"
bytemuck = "1"
half = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
thiserror = "1"

# --- build ---
naga = "23"

# --- dev ---
# A matcher and assertion library modelled on GoogleTest, from Google. Adopted
# for one thing the built-in harness does not have: an assertion that records a
# failure and lets the test continue. Several tests here sweep a set of inputs
# and want every failure in the set reported, not the first -- which had been
# hand-rolled four separate times as a vector of strings.
googletest = "0.14"
proptest = "1"
criterion = "0.5"
image = "0.25"
winit = "0.30"
cosmic-text = "0.12"
usvg = "0.43"

# --- internal ---
impeller-core = { path = "crates/impeller-core" }
impeller-entity = { path = "crates/impeller-entity" }
impeller-geometry = { path = "crates/impeller-geometry" }
impeller-hal = { path = "crates/impeller-hal" }
impeller-hal-gles = { path = "crates/impeller-hal-gles" }
impeller-hal-vulkan = { path = "crates/impeller-hal-vulkan" }
impeller-present = { path = "crates/impeller-present" }
impeller-present-drm = { path = "crates/impeller-present-drm" }
impeller-present-egl = { path = "crates/impeller-present-egl" }
impeller-present-vk = { path = "crates/impeller-present-vk" }
impeller-renderer = { path = "crates/impeller-renderer" }
impeller-shaders = { path = "crates/impeller-shaders" }
impeller-testkit = { path = "crates/impeller-testkit" }
impeller-text = { path = "crates/impeller-text" }

[profile.release]
lto = "thin"
codegen-units = 1
